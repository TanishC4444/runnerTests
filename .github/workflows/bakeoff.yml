name: Local AI Model Bake-Off (Parallel, one model per runner)

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated Ollama model tags to test"
        type: string
        default: >-
          qwen2.5:0.5b,qwen2.5:1.5b,qwen2.5:3b,qwen2.5:7b,
          qwen3:4b,qwen2.5-coder:1.5b,qwen2.5-coder:3b,qwen2.5-coder:7b,
          llama3.2:1b,llama3.2:3b,llama3.1:8b,
          gemma2:2b,gemma3:4b,
          phi3.5:3.8b,phi4-mini:3.8b,
          tinyllama:1.1b,mistral:7b,
          deepseek-r1:1.5b,deepseek-r1:7b,deepseek-r1:8b,
          codegemma:7b,starcoder2:3b,
          hermes3:8b,gpt-oss:20b
      # Each model now gets its OWN runner, so per-runner disk is never an
      # issue (biggest single model is gpt-oss:20b at ~14GB). The tradeoff
      # is concurrency: GitHub caps how many jobs from one workflow run can
      # execute at once. Free/Pro accounts: 20 concurrent jobs. Team: 40.
      # Enterprise: up to 180. With 24 models and max-parallel: 20 below,
      # 20 run immediately and the last 4 queue in as slots free up -- still
      # far faster than the old serial version.
      trials_per_prompt:
        description: "How many times to repeat each prompt per model"
        type: string
        default: "2"
      max_tokens:
        description: "Max tokens to generate per response"
        type: string
        default: "100"
      per_model_timeout_sec:
        description: "Soft cap (seconds) on prompt-loop time before moving to tool tests"
        type: string
        default: "900"

jobs:
  # ---------------------------------------------------------------------
  # Turn the comma-separated input into a JSON array for the matrix below.
  # ---------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build model matrix from input
        id: set-matrix
        run: |
          CLEAN=$(echo "${{ inputs.models }}" | tr -d ' \n')
          JSON=$(python3 -c "
          import json, sys
          models = [m for m in sys.argv[1].split(',') if m]
          print(json.dumps(models))
          " "$CLEAN")
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Model matrix ($(echo "$JSON" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))') models): $JSON"

  # ---------------------------------------------------------------------
  # One runner per model, all in parallel (up to max-parallel at a time).
  # fail-fast: false so one model timing out/OOMing doesn't cancel the rest.
  # ---------------------------------------------------------------------
  benchmark:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        model: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Sanitize model name for artifact naming
        id: safe-name
        run: |
          SAFE=$(echo "${{ matrix.model }}" | tr ':/' '--')
          echo "name=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Free disk space (light cleanup, cheap insurance)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          df -h / | tail -1

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Install Python deps (psutil for RAM tracking)
        run: python3 -m pip install --quiet --user psutil

      - name: Start Ollama server in background
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://localhost:11434 > /dev/null && break
            sleep 1
          done
          curl -s http://localhost:11434
          free -h

      - name: Pull this runner's model
        id: pull
        run: |
          echo "=== Pulling ${{ matrix.model }} ==="
          if ollama pull "${{ matrix.model }}"; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pull failed for ${{ matrix.model }} — this model will be recorded as a failure and skipped."
          fi
          df -h / | tail -1
          ollama list

      - name: Write benchmark prompt set
        run: |
          mkdir -p /tmp/bench
          cat > /tmp/bench/prompts.json << 'EOF'
          [
            {"category": "factual",   "prompt": "What is the capital of France? Answer in one sentence."},
            {"category": "reasoning", "prompt": "If a train leaves at 2pm going 60mph and another leaves at 3pm going 90mph on the same route, when does the second train catch up? Show your work briefly."},
            {"category": "coding",    "prompt": "Write a Python function that returns the nth Fibonacci number using memoization."},
            {"category": "instruction_following", "prompt": "List exactly 5 fruits, one per line, numbered 1 through 5, nothing else."}
          ]
          EOF

      - name: Write MCP / tool-calling test cases
        run: |
          cat > /tmp/bench/tool_tests.json << 'EOF'
          [
            {
              "name": "basic_tool_call",
              "system": "You are a helpful assistant with access to tools. Use them when appropriate.",
              "user": "What's the weather like in Paris right now?",
              "tools": [
                {
                  "type": "function",
                  "function": {
                    "name": "get_current_weather",
                    "description": "Get the current weather for a location",
                    "parameters": {
                      "type": "object",
                      "properties": {
                        "location": {"type": "string", "description": "City name"},
                        "unit": {"type": "string", "enum": ["celsius", "fahrenheit"]}
                      },
                      "required": ["location"]
                    }
                  }
                }
              ],
              "expect_function": "get_current_weather",
              "expect_arg_substring": {"location": "paris"}
            },
            {
              "name": "skill_style_docx_tool",
              "system": "You are an assistant that helps create documents. You have a tool called create_docx that generates a Word document. Use it whenever the user asks for a document, report, or written file to be created.",
              "user": "Can you make me a short document titled 'Meeting Notes' summarizing that we discussed Q3 budget cuts?",
              "tools": [
                {
                  "type": "function",
                  "function": {
                    "name": "create_docx",
                    "description": "Create a Word document with a title and body content",
                    "parameters": {
                      "type": "object",
                      "properties": {
                        "title": {"type": "string"},
                        "content": {"type": "string"}
                      },
                      "required": ["title", "content"]
                    }
                  }
                }
              ],
              "expect_function": "create_docx",
              "expect_arg_substring": {"title": "meeting"}
            },
            {
              "name": "should_not_call_tool",
              "system": "You are a helpful assistant with access to tools. Only use a tool when the user's request actually needs it.",
              "user": "What is 12 plus 30?",
              "tools": [
                {
                  "type": "function",
                  "function": {
                    "name": "get_current_weather",
                    "description": "Get the current weather for a location",
                    "parameters": {
                      "type": "object",
                      "properties": {"location": {"type": "string"}},
                      "required": ["location"]
                    }
                  }
                }
              ],
              "expect_function": null,
              "expect_arg_substring": null
            }
          ]
          EOF

      - name: Benchmark this model (speed + RAM + tool-calling)
        run: |
          cat > /tmp/bench/run_single.py << 'PYEOF'
          import json, time, subprocess, os, csv, threading, re
          import urllib.request
          import psutil

          MODEL = os.environ["MODEL"]
          TRIALS = int(os.environ["TRIALS"])
          MAX_TOKENS = int(os.environ["MAX_TOKENS"])
          PER_MODEL_TIMEOUT = int(os.environ["PER_MODEL_TIMEOUT"])

          with open("/tmp/bench/prompts.json") as f:
              PROMPTS = json.load(f)
          with open("/tmp/bench/tool_tests.json") as f:
              TOOL_TESTS = json.load(f)

          def get_model_disk_size_mb(model):
              out = subprocess.run(["ollama", "list"], capture_output=True, text=True).stdout
              for line in out.splitlines()[1:]:
                  if not line.strip() or line.split()[0] != model:
                      continue
                  m = re.search(r"([\d.]+)\s*(GB|MB)", line, re.IGNORECASE)
                  if not m:
                      return None
                  value, unit = float(m.group(1)), m.group(2).upper()
                  return round(value * 1024 if unit == "GB" else value, 1)
              return None

          DISK_SIZE_MB = get_model_disk_size_mb(MODEL)

          class RamSampler:
              def __init__(self, interval=0.2):
                  self.interval = interval
                  self.samples = []
                  self._stop = threading.Event()
                  self._thread = None

              def _run(self):
                  while not self._stop.is_set():
                      self.samples.append(psutil.virtual_memory().used / (1024 * 1024))
                      time.sleep(self.interval)

              def start(self):
                  self.samples = []
                  self._stop.clear()
                  self._thread = threading.Thread(target=self._run, daemon=True)
                  self._thread.start()

              def stop(self):
                  self._stop.set()
                  if self._thread:
                      self._thread.join(timeout=2)
                  return self.samples

          def call_ollama(model, prompt, max_tokens):
              payload = json.dumps({
                  "model": model, "prompt": prompt, "stream": False,
                  "options": {"num_predict": max_tokens}
              }).encode()
              req = urllib.request.Request(
                  "http://localhost:11434/api/generate", data=payload,
                  headers={"Content-Type": "application/json"}
              )
              sampler = RamSampler()
              baseline = psutil.virtual_memory().used / (1024 * 1024)
              sampler.start()
              start = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=180) as resp:
                      body = json.loads(resp.read())
                  err = None
              except Exception as e:
                  body, err = None, str(e)
              elapsed = time.time() - start
              samples = sampler.stop()
              peak = max(samples) if samples else baseline
              return body, elapsed, err, round(peak, 1), round(peak - baseline, 1)

          def call_ollama_chat_with_tools(model, test):
              payload = json.dumps({
                  "model": model,
                  "messages": [
                      {"role": "system", "content": test["system"]},
                      {"role": "user", "content": test["user"]},
                  ],
                  "tools": test["tools"], "stream": False,
              }).encode()
              req = urllib.request.Request(
                  "http://localhost:11434/api/chat", data=payload,
                  headers={"Content-Type": "application/json"}
              )
              start = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      body = json.loads(resp.read())
                  err = None
              except Exception as e:
                  body, err = None, str(e)
              return body, time.time() - start, err

          def score_tool_call(body, test):
              if not body:
                  return False, False, False, "no response body"
              msg = body.get("message", {})
              tool_calls = msg.get("tool_calls") or []
              called = len(tool_calls) > 0
              if test["expect_function"] is None:
                  correct = not called
                  return called, correct, correct, (
                      "correctly avoided calling a tool" if correct
                      else "incorrectly called a tool when it shouldn't have"
                  )
              if not called:
                  return False, False, False, "model did not call any tool"
              fn = tool_calls[0].get("function", {})
              fn_name = fn.get("name", "")
              correct_fn = fn_name == test["expect_function"]
              args = fn.get("arguments", {})
              if isinstance(args, str):
                  try:
                      args = json.loads(args)
                  except Exception:
                      args = {}
              correct_args = True
              if test["expect_arg_substring"]:
                  for k, expected_sub in test["expect_arg_substring"].items():
                      if expected_sub not in str(args.get(k, "")).lower():
                          correct_args = False
              return called, correct_fn, correct_args, f"called {fn_name} with args {args}"

          results = []
          tool_results = []

          check = subprocess.run(["ollama", "list"], capture_output=True, text=True)
          if MODEL not in check.stdout:
              print(f"SKIP {MODEL}: not present locally (pull failed)")
              results.append({
                  "model": MODEL, "category": "N/A", "trial": 0, "prompt": "",
                  "elapsed_sec": None, "error": "pull_failed_or_missing",
                  "output": "", "output_len_chars": 0, "tokens_generated": 0,
                  "tokens_per_sec": None, "load_time_sec": None,
                  "peak_ram_mb": None, "ram_delta_mb": None, "disk_size_mb": DISK_SIZE_MB,
              })
          else:
              model_start = time.time()
              timed_out = False
              for p in PROMPTS:
                  for trial in range(1, TRIALS + 1):
                      if time.time() - model_start > PER_MODEL_TIMEOUT:
                          timed_out = True
                          break
                      print(f"  {p['category']} trial {trial}/{TRIALS}...", flush=True)
                      body, elapsed, err, peak_ram, ram_delta = call_ollama(MODEL, p["prompt"], MAX_TOKENS)
                      row = {
                          "model": MODEL, "category": p["category"], "trial": trial,
                          "prompt": p["prompt"], "elapsed_sec": round(elapsed, 3), "error": err,
                          "peak_ram_mb": peak_ram, "ram_delta_mb": ram_delta, "disk_size_mb": DISK_SIZE_MB,
                      }
                      if body and not err:
                          output_text = body.get("response", "").strip()
                          eval_count = body.get("eval_count", 0)
                          eval_ns = body.get("eval_duration", 0)
                          load_ns = body.get("load_duration", 0)
                          tok_s = (eval_count / (eval_ns / 1e9)) if eval_ns else None
                          row.update({
                              "output": output_text[:500], "output_len_chars": len(output_text),
                              "tokens_generated": eval_count,
                              "tokens_per_sec": round(tok_s, 2) if tok_s else None,
                              "load_time_sec": round(load_ns / 1e9, 3),
                          })
                      else:
                          row.update({"output": "", "output_len_chars": 0, "tokens_generated": 0,
                                      "tokens_per_sec": None, "load_time_sec": None})
                      results.append(row)
                  if timed_out:
                      print("  per-model time budget hit, moving to tool tests")
                      break

              print("  running tool-calling tests...", flush=True)
              for test in TOOL_TESTS:
                  body, elapsed, err = call_ollama_chat_with_tools(MODEL, test)
                  called, correct_fn, correct_args, notes = (
                      score_tool_call(body, test) if not err else (False, False, False, err)
                  )
                  tool_results.append({
                      "model": MODEL, "test_name": test["name"], "elapsed_sec": round(elapsed, 3),
                      "called_tool": called, "correct_function": correct_fn,
                      "correct_args": correct_args, "passed": correct_fn and correct_args,
                      "notes": notes, "error": err,
                  })
              subprocess.run(["ollama", "stop", MODEL], capture_output=True)

          with open("/tmp/bench/raw_results.json", "w") as f:
              json.dump(results, f, indent=2)
          with open("/tmp/bench/raw_results.csv", "w", newline="") as f:
              fieldnames = ["model","category","trial","elapsed_sec","tokens_generated",
                            "tokens_per_sec","load_time_sec","peak_ram_mb","ram_delta_mb",
                            "disk_size_mb","output_len_chars","error","output","prompt"]
              w = csv.DictWriter(f, fieldnames=fieldnames)
              w.writeheader()
              for r in results:
                  w.writerow(r)

          with open("/tmp/bench/tool_results.json", "w") as f:
              json.dump(tool_results, f, indent=2)
          with open("/tmp/bench/tool_results.csv", "w", newline="") as f:
              fieldnames = ["model","test_name","elapsed_sec","called_tool","correct_function",
                            "correct_args","passed","notes","error"]
              w = csv.DictWriter(f, fieldnames=fieldnames)
              w.writeheader()
              for r in tool_results:
                  w.writerow(r)

          # single-model summary, so the merge job doesn't need to recompute stats
          speeds = [r["tokens_per_sec"] for r in results if r.get("tokens_per_sec")]
          elapsed_list = [r["elapsed_sec"] for r in results if r.get("elapsed_sec") is not None]
          ram_deltas = [r["ram_delta_mb"] for r in results if r.get("ram_delta_mb") is not None]
          peak_rams = [r["peak_ram_mb"] for r in results if r.get("peak_ram_mb") is not None]
          passed = sum(1 for r in tool_results if r["passed"])
          summary = {
              "model": MODEL,
              "disk_size_mb": DISK_SIZE_MB,
              "runs": len(results),
              "errors": sum(1 for r in results if r.get("error")),
              "avg_tokens_per_sec": round(sum(speeds) / len(speeds), 2) if speeds else None,
              "avg_response_time_sec": round(sum(elapsed_list) / len(elapsed_list), 2) if elapsed_list else None,
              "avg_ram_delta_mb": round(sum(ram_deltas) / len(ram_deltas), 1) if ram_deltas else None,
              "peak_ram_mb": round(max(peak_rams), 1) if peak_rams else None,
              "tool_use_pass_rate": f"{passed}/{len(tool_results)}" if tool_results else "N/A",
          }
          with open("/tmp/bench/model_summary.json", "w") as f:
              json.dump(summary, f, indent=2)

          print("\n" + json.dumps(summary, indent=2))
          PYEOF

          MODEL="${{ matrix.model }}" \
          TRIALS="${{ inputs.trials_per_prompt }}" \
          MAX_TOKENS="${{ inputs.max_tokens }}" \
          PER_MODEL_TIMEOUT="${{ inputs.per_model_timeout_sec }}" \
            python3 /tmp/bench/run_single.py

      - name: Upload this model's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakeoff-${{ steps.safe-name.outputs.name }}
          path: |
            /tmp/bench/raw_results.json
            /tmp/bench/raw_results.csv
            /tmp/bench/tool_results.json
            /tmp/bench/tool_results.csv
            /tmp/bench/model_summary.json
          retention-days: 14

  # ---------------------------------------------------------------------
  # Runs once, after all matrix legs finish (even if some failed/timed out),
  # and combines every model's artifact into one ranked report.
  # ---------------------------------------------------------------------
  merge:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all per-model artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bakeoff-*
          path: /tmp/artifacts

      - name: Merge into final ranked report
        run: |
          mkdir -p /tmp/merged
          cat > /tmp/merge.py << 'PYEOF'
          import json, csv, glob, os

          all_results, all_tools, all_summaries = [], [], []
          for d in sorted(glob.glob("/tmp/artifacts/*")):
              for fname, bucket in [("raw_results.json", all_results),
                                     ("tool_results.json", all_tools),
                                     ("model_summary.json", None)]:
                  path = os.path.join(d, fname)
                  if not os.path.exists(path):
                      continue
                  with open(path) as f:
                      data = json.load(f)
                  if fname == "model_summary.json":
                      all_summaries.append(data)
                  else:
                      bucket.extend(data if isinstance(data, list) else [data])

          all_summaries.sort(key=lambda x: (x["avg_tokens_per_sec"] is None, -(x["avg_tokens_per_sec"] or 0)))

          with open("/tmp/merged/raw_results_all.json", "w") as f:
              json.dump(all_results, f, indent=2)
          with open("/tmp/merged/tool_results_all.json", "w") as f:
              json.dump(all_tools, f, indent=2)
          with open("/tmp/merged/summary.json", "w") as f:
              json.dump(all_summaries, f, indent=2)

          if all_results:
              fieldnames = list(all_results[0].keys())
              with open("/tmp/merged/raw_results_all.csv", "w", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=fieldnames)
                  w.writeheader()
                  for r in all_results:
                      w.writerow(r)
          if all_tools:
              fieldnames = list(all_tools[0].keys())
              with open("/tmp/merged/tool_results_all.csv", "w", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=fieldnames)
                  w.writeheader()
                  for r in all_tools:
                      w.writerow(r)

          lines = []
          lines.append("# Local AI Model Bake-Off — Merged Parallel Results\n")
          lines.append(f"Models with data: {len(all_summaries)}\n")
          lines.append("## Ranked Summary (fastest first)\n")
          lines.append("| Rank | Model | Disk (MB) | Avg tok/s | Avg resp time (s) | Avg RAM delta (MB) | Peak RAM (MB) | Tool-use pass | Runs | Errors |")
          lines.append("|---|---|---|---|---|---|---|---|---|---|")
          for i, r in enumerate(all_summaries, 1):
              lines.append(
                  f"| {i} | {r['model']} | {r['disk_size_mb']} | {r['avg_tokens_per_sec']} | "
                  f"{r['avg_response_time_sec']} | {r['avg_ram_delta_mb']} | {r['peak_ram_mb']} | "
                  f"{r['tool_use_pass_rate']} | {r['runs']} | {r['errors']} |"
              )

          lines.append("\n## MCP / Tool-Calling Detail\n")
          lines.append("| Model | Test | Called tool? | Correct function? | Correct args? | Passed | Notes |")
          lines.append("|---|---|---|---|---|---|---|")
          for r in all_tools:
              lines.append(
                  f"| {r['model']} | {r['test_name']} | {r['called_tool']} | {r['correct_function']} | "
                  f"{r['correct_args']} | {'✅' if r['passed'] else '❌'} | {str(r['notes'])[:120]} |"
              )

          lines.append("\n## Sample outputs (first trial of each model/category)\n")
          seen = set()
          for r in all_results:
              key = (r["model"], r["category"])
              if key in seen or r.get("trial") != 1:
                  continue
              seen.add(key)
              lines.append(f"### {r['model']} — {r['category']}")
              if r.get("prompt"):
                  lines.append(f"**Prompt:** {r['prompt']}\n")
              if r.get("error"):
                  lines.append(f"**Error:** {r['error']}\n")
              else:
                  lines.append(f"**Output** ({r.get('tokens_generated', 0)} tokens, {r.get('tokens_per_sec')} tok/s, "
                                f"RAM delta {r.get('ram_delta_mb')} MB):")
                  lines.append(f"> {r['output']}\n")

          report = "\n".join(lines)
          with open("/tmp/merged/report.md", "w") as f:
              f.write(report)
          print(report)
          PYEOF
          python3 /tmp/merge.py

      - name: Append merged report to job summary
        if: always()
        run: cat /tmp/merged/report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload FINAL merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-bakeoff-FINAL-merged-results
          path: /tmp/merged/*
          retention-days: 30
