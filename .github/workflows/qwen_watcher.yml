name: Qwen Chunk Watcher
# Triggered manually (via API/token) once, at the start of a session.
# NOT triggered per-chunk — one runner stays alive and works through
# every chunk sequentially via its own poll loop.
on:
  workflow_dispatch: {}

# A previous session must not keep polling the same file with the same token.
concurrency:
  group: qwen-chunk-watcher
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # stay under the 360min (6h) hard cap
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT stored as a repo secret, never hardcoded
          token: ${{ secrets.RUNNER_PAT }}
      - name: Install complete Ollama runtime
        run: |
          # Do not cache /usr/local/bin/ollama separately. The executable and
          # lib/ollama/llama-server are one installation unit; restoring only
          # part of it produces an Ollama API that answers health checks but
          # returns HTTP 500 for every generation request.
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

          # Keep Ollama under the runner account so ~/.ollama/models is the
          # model directory restored/saved below. The installer can start a
          # system service under a different account, so stop that instance.
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > ollama.log 2>&1 &
          # wait for the server to come up
          ready=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::Ollama server never became reachable, dumping log:"
            cat ollama.log
            exit 1
          fi
      - name: Restore Ollama model cache
        id: cache-ollama
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          # v2 forces one clean model download instead of trusting the old
          # manifest/blob cache that produced a generation-time HTTP 500.
          key: ollama-qwen2.5-3b-v2
        continue-on-error: true
      - name: Verify/pull Qwen 2.5 3B
        run: |
          # Pull even after a cache hit. Ollama reuses valid blobs but verifies
          # the manifest and restores anything missing or damaged.
          ollama pull qwen2.5:3b
      - name: Save Ollama model cache
        # Save it right here, immediately after the pull -- not deferred
        # to the job's post-cleanup phase. run_all.py cancels this
        # workflow run via the API on every session, and a cancelled
        # job's post-steps get a very short grace period, which isn't
        # enough time for a multi-GB cache upload to finish. Saving now,
        # before the long watcher-loop step (the one that gets
        # cancelled) even starts, means the cache always gets written.
        if: steps.cache-ollama.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b-v2
        continue-on-error: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          pip install requests gTTS
          python -c "import requests, gtts; print('requests', requests.__version__); print('gTTS OK, module at', gtts.__file__)"
      - name: Run watcher loop
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PYTHONUNBUFFERED: "1"   # step logs are not a TTY -- without this, prints can sit buffered and invisible
        run: |
          set -o pipefail
          dump_ollama_log() {
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "::group::Ollama server log"
              cat ollama.log || true
              echo "::endgroup::"
            fi
            exit "$code"
          }
          trap dump_ollama_log EXIT
          python -u watch_and_respond.py
