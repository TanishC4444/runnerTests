name: Qwen Chunk Watcher
# Triggered manually (via API/token) once, at the start of a session.
# NOT triggered per-chunk — one runner stays alive and works through
# every chunk sequentially via its own poll loop.
on:
  workflow_dispatch: {}
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # stay under the 360min (6h) hard cap
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT stored as a repo secret, never hardcoded
          token: ${{ secrets.RUNNER_PAT }}
      - name: Restore Ollama binary cache
        id: cache-ollama-bin
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/bin/ollama
            /usr/local/lib/ollama
          key: ollama-bin-linux-v1
        continue-on-error: true   # caching is a nice-to-have, never worth failing the session over
      - name: Install Ollama (skip download if cached)
        run: |
          # guarantee this exists even on Ollama versions that don't create
          # it, so the save step below never fails with "path does not exist"
          # -- needs sudo, /usr/local/lib isn't writable by the runner user
          sudo mkdir -p /usr/local/lib/ollama

          if [ -x /usr/local/bin/ollama ]; then
            echo "Ollama binary restored from cache, skipping install script."
          else
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama --version

          nohup ollama serve > ollama.log 2>&1 &
          # wait for the server to come up
          ready=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::Ollama server never became reachable, dumping log:"
            cat ollama.log
            exit 1
          fi
      - name: Save Ollama binary cache
        # Same reasoning as the model cache below: save immediately after
        # confirming ollama serve works, not deferred to job post-cleanup,
        # since run_all.py cancels this run on every session and a
        # cancelled job's post-steps don't get much grace time.
        if: steps.cache-ollama-bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/bin/ollama
            /usr/local/lib/ollama
          key: ollama-bin-linux-v1
        continue-on-error: true
      - name: Restore Ollama model cache
        id: cache-ollama
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b-v1
        continue-on-error: true
      - name: Pull Qwen 2.5 3B (skip if already cached)
        run: |
          if ollama list | grep -q "qwen2.5:3b"; then
            echo "qwen2.5:3b already present from cache restore, skipping download."
          else
            echo "Not found in restored cache, pulling..."
            ollama pull qwen2.5:3b
          fi
      - name: Save Ollama model cache
        # Save it right here, immediately after the pull -- not deferred
        # to the job's post-cleanup phase. run_all.py cancels this
        # workflow run via the API on every session, and a cancelled
        # job's post-steps get a very short grace period, which isn't
        # enough time for a multi-GB cache upload to finish. Saving now,
        # before the long watcher-loop step (the one that gets
        # cancelled) even starts, means the cache always gets written.
        if: steps.cache-ollama.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b-v1
        continue-on-error: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          pip install requests gTTS
          python -c "import requests, gtts; print('requests', requests.__version__); print('gTTS OK, module at', gtts.__file__)"
      - name: Run watcher loop
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"   # step logs are not a TTY -- without this, prints can sit buffered and invisible
        run: python -u watch_and_respond.py