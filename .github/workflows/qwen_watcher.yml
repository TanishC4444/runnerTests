name: Qwen Chunk Watcher
# Triggered manually (via API/token) once, at the start of a session.
# NOT triggered per-chunk — one runner stays alive and works through
# every chunk sequentially via its own poll loop.
on:
  workflow_dispatch: {}

# A previous session must not keep polling the same file with the same token.
concurrency:
  group: qwen-chunk-watcher
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # stay under the 360min (6h) hard cap
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT stored as a repo secret, never hardcoded
          token: ${{ secrets.RUNNER_PAT }}
      - name: Install complete Ollama runtime
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

          echo "CPU cores visible to this runner:"
          nproc
          CORES=$(nproc)

          sudo systemctl stop ollama 2>/dev/null || true

          # Ollama's own core auto-detection can under-count inside a CI
          # container -- pin it explicitly instead of trusting the default,
          # and disable multi-model/parallel-request overhead we don't need
          # for one sequential conversation (frees that memory/scheduling
          # headroom for the single model actually in use).
          export OLLAMA_NUM_THREAD="$CORES"
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1

          nohup ollama serve > ollama.log 2>&1 &
          ready=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::Ollama server never became reachable, dumping log:"
            cat ollama.log
            exit 1
          fi
      - name: Restore Ollama model cache
        id: cache-ollama
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b-v2
        continue-on-error: true
      - name: Verify/pull Qwen 2.5 3B
        run: |
          ollama pull qwen2.5:3b
      - name: Save Ollama model cache
        if: steps.cache-ollama.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b-v2
        continue-on-error: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Now that edge_tts is gone from this side, the dependency list
          # is tiny (just requests) -- but caching pip's own download/wheel
          # cache still shaves a couple seconds of "resolve + download" off
          # every cold job, basically free to leave on.
          cache: "pip"
          cache-dependency-path: requirements-runner.txt
      - name: Install Python deps
        run: |
          pip install -r requirements-runner.txt
          python -c "import requests; print('requests', requests.__version__)"
      - name: Run watcher loop
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          dump_ollama_log() {
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "::group::Ollama server log"
              cat ollama.log || true
              echo "::endgroup::"
            fi
            exit "$code"
          }
          trap dump_ollama_log EXIT
          python -u watch_and_respond.py